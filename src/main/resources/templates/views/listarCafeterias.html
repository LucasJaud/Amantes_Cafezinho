<!DOCTYPE html>
<html lang="pt_BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Amantes do Cafezinho | Cafeterias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F5EBDD] text-[#4B2E2B]" layout:fragment="content">

<main class="flex flex-1 flex-col h-full justify-center items-center mb-8 mt-8">
    <div class="flex flex-col gap-2 max-w-[800px] w-full bg-white shadow-md rounded-xl p-10 border border-zinc-200">
        <form th:action="@{/cafeteria/listarCafeterias}" method="GET" class="flex flex-col gap-2">
            <div class="flex gap-2">
                <input type="text" name="nome" placeholder="Nome da Cafeteria"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4B2E2B]">

                <select name="minRating"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4B2E2B]">
                    <option value="">Todas as avaliações</option>
                    <option value="1">1 estrela ou mais</option>
                    <option value="2">2 estrelas ou mais</option>
                    <option value="3">3 estrelas ou mais</option>
                    <option value="4">4 estrelas ou mais</option>
                    <option value="5">5 estrelas</option>
                </select>

                <button type="submit"
                        class="bg-[#4B2E2B] text-white px-6 py-2 rounded-lg font-medium hover:bg-[#F5EBDD] transition whitespace-nowrap">
                    Buscar Cafeterias
                </button>
            </div>
        </form>

        <div th:if="${cafeterias != null and !cafeterias.isEmpty()}" class="mt-6">
            <h2 class="text-2xl font-bold mb-4">Cafeterias Encontradas</h2>
            <ul class="space-y-4">
                <li th:each="cafeteria : ${cafeterias}" class="p-4 bg-gray-100 rounded-lg shadow-sm hover:bg-gray-200 transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-xl font-semibold" th:text="${cafeteria.fantasyName}"></h3>
                            <p th:text="${cafeteria.socialReason}"></p>
                        </div>
                        <a th:href="@{/cafeteria/{cnpj}(cnpj=${cafeteria.CNPJ})}"
                           class="text-amber-600 hover:text-amber-800 font-medium">
                            Ver detalhes →
                        </a>
                    </div>
                </li>
            </ul>
        </div>
        <div th:unless="${cafeterias != null and !cafeterias.isEmpty()}">
            <p class="text-gray-500">Nenhuma cafeteria encontrada.</p>
        </div>
    </div>
</main>
</body>
